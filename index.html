<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナインボール対戦 7フィート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one column — scoreboard, table, controls. Single dark "pool hall" look by choice; no web fonts so it runs fully offline */
:root{
  --bg:#13181a; --panel:#1c2326; --line:#2d3639;
  --fg:#ece6d8; --muted:#97a29d; --accent:#d8b25a; --foul:#e57b5f; --win:#7fd19b;
  --font:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px}
.app{max-width:1040px;margin:0 auto;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.pl.r{justify-content:flex-end}
.pl .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tag{font-size:11px;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--accent);color:#1a1408;visibility:hidden}
.pl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pl.on .tag{visibility:visible}
.tgt{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.tgt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:13px;color:#111;position:relative;overflow:hidden}
.tgt b span{background:#fff;border-radius:50%;width:17px;height:17px;display:grid;place-items:center;position:relative}
.msg{min-height:1.5em;font-size:15px;font-weight:600;text-align:center}
.msg.foul{color:var(--foul)} .msg.win{color:var(--win)}
.tablewrap{width:100%}
#c{display:block;touch-action:none;cursor:crosshair;border-radius:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.aimb{min-width:48px;font-size:16px}
.shot{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700;padding:9px 26px}
.shot:hover{border-color:#fff}
.pow{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pow input{width:min(220px,40vw);accent-color:var(--accent)}
.pow output{font-variant-numeric:tabular-nums;color:var(--fg);width:2.2em;text-align:right}
.help{color:var(--muted);font-size:12px;line-height:1.7;max-width:70ch;margin:0 auto;text-align:center}
/* 大画面モード：画面いっぱいに台を表示 */
body.big .app{max-width:none;height:100vh;height:100dvh;box-sizing:border-box;padding-block:8px;gap:6px}
body.big .tablewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
body.big .help{display:none}
body.big .hud{font-size:18px}
body.big .msg{font-size:20px;min-height:1.3em}
body.big .pl{padding:6px 14px}
body.big .ctrl{gap:8px}
@media (max-width:560px){.hud{grid-template-columns:1fr 1fr}.tgt{grid-column:1/-1;grid-row:1;justify-content:center}}
</style>

<div class="app">
  <div class="hud">
    <div class="pl" id="pl0"><span class="nm">プレイヤー1</span><span class="tag">手番</span></div>
    <div class="tgt">狙う球 <b id="tb"><span id="tbn">1</span></b></div>
    <div class="pl r" id="pl1"><span class="tag">手番</span><span class="nm">プレイヤー2</span></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="tablewrap" id="wrap"><canvas id="c"></canvas></div>
  <div class="ctrl">
    <button class="aimb" id="aimL" aria-label="狙いを左へ微調整">◀</button>
    <button class="aimb" id="aimR" aria-label="狙いを右へ微調整">▶</button>
    <label class="pow" for="pw">パワー <input type="range" id="pw" min="5" max="100" value="55"><output id="pv">55</output></label>
    <button class="shot" id="shot">ショット</button>
    <button id="newg">新しいゲーム</button>
    <button id="bigb">大画面</button>
  </div>
  <p class="help">台をタップ／ドラッグで狙う方向を決め、◀▶で微調整。点線が手球の通り道、金色の線は当てた球の進む方向です。<br>
  ファウル後は「フリーボール」：手球をドラッグして好きな位置に置けます（ブレイク時は左の線より左側）。<br>
  キーボード：←→ 狙い（Shiftで細かく）／ ↑↓ パワー ／ Space ショット ／ F 大画面の切り替え</p>
</div>

<script>
(()=>{
/* 実寸比（7フィート台）：プレイ面 78×39インチ、ボール直径 2.25インチ、
   コーナーポケット口 4.5インチ、サイドポケット口 5インチ。1インチ = 900/78px。物理の速さ・減速も同じ比で換算 */
const IN=900/78,SC=IN/9,W=78*IN,H=39*IN,R=2.25/2*IN,B=5*IN,CW=W+2*B,CH=H+2*B,CM=4.5/Math.SQRT2*IN,SM=5/2*IN,HEAD=W*0.25,FOOT=W*0.75;
const COL=['#f4f1ea','#f2c230','#1f5fbf','#d23b2f','#5b3a9b','#ee7a1e','#1f8a4c','#8a2430','#151515','#f2c230'];
const NAMES=['プレイヤー1','プレイヤー2'];
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);
const pw=$('pw'),pv=$('pv'),msgEl=$('msg'),shotBtn=$('shot');
let scale=1,tableImg=document.createElement('canvas'),sprites=[];
let balls,cue,turn,ballInHand,breakShot,moving,gameOver,aim,shot,msg,msgType,drag=null,rafId=0;

/* ---------- 描画準備 ---------- */
function resize(){
  let w=wrap.clientWidth;
  if(document.body.classList.contains('big'))w=Math.min(w,wrap.clientHeight*CW/CH);
  w=Math.floor(w);
  const dpr=Math.min(window.devicePixelRatio||1,2),h=w*CH/CW;
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=cv.width/CW;buildTable();buildSprites();req();
}
function buildTable(){
  tableImg.width=cv.width;tableImg.height=cv.height;
  const t=tableImg.getContext('2d');t.setTransform(scale,0,0,scale,0,0);
  const g=t.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#6b4226');g.addColorStop(1,'#4a2c18');
  t.fillStyle=g;rr(t,0,0,CW,CH,18);t.fill();
  t.fillStyle='#155c3b';t.fillRect(B-10,B-10,W+20,H+20);
  t.fillStyle='#1d7a4e';t.fillRect(B,B,W,H);
  t.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<6;i++){t.fillRect(B,B+i*2,W,1)}
  // ヘッドライン・フットスポット
  t.strokeStyle='rgba(255,255,255,.14)';t.lineWidth=1;t.beginPath();t.moveTo(B+HEAD,B);t.lineTo(B+HEAD,B+H);t.stroke();
  t.fillStyle='rgba(255,255,255,.35)';dot(t,B+FOOT,B+H/2,2.5);dot(t,B+HEAD,B+H/2,2.5);
  // ポケット
  t.fillStyle='#070707';
  [[0,0],[W,0],[0,H],[W,H]].forEach(([x,y])=>dot(t,B+x+(x?4:-4),B+y+(y?4:-4),CM*0.9));
  [[W/2,0],[W/2,H]].forEach(([x,y])=>dot(t,B+x,B+y+(y?7:-7),SM+4));
  // ダイヤモンド
  t.fillStyle='#e9dcc0';
  for(let i=1;i<8;i++){if(i===4)continue;dot(t,B+W*i/8,B-24,2.6);dot(t,B+W*i/8,B+H+24,2.6)}
  for(let i=1;i<4;i++){dot(t,B-24,B+H*i/4,2.6);dot(t,B+W+24,B+H*i/4,2.6)}
}
function buildSprites(){
  sprites=COL.map((c,n)=>{
    const s=document.createElement('canvas'),px=Math.ceil((2*R+2)*scale);s.width=s.height=px;
    const x=s.getContext('2d'),k=px/(2*R+2);x.setTransform(k,0,0,k,(R+1)*k,(R+1)*k);
    x.beginPath();x.arc(0,0,R,0,7);x.fillStyle=n===9?'#f4f1ea':c;x.fill();
    if(n===9){x.save();x.clip();x.fillStyle=c;x.fillRect(-R,-R*0.55,2*R,R*1.1);x.restore()}
    if(n>0){x.beginPath();x.arc(0,0,R*0.5,0,7);x.fillStyle='#fff';x.fill();
      x.fillStyle='#111';x.font=`bold ${R*0.72}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(n,0,R*0.05)}
    x.beginPath();x.arc(-R*0.38,-R*0.42,R*0.24,0,7);x.fillStyle='rgba(255,255,255,.55)';x.fill();
    x.beginPath();x.arc(0,0,R-0.4,0,7);x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=0.8;x.stroke();
    return s;
  });
}
function rr(t,x,y,w,h,r){t.beginPath();t.moveTo(x+r,y);t.arcTo(x+w,y,x+w,y+h,r);t.arcTo(x+w,y+h,x,y+h,r);t.arcTo(x,y+h,x,y,r);t.arcTo(x,y,x+w,y,r);t.closePath()}
function dot(t,x,y,r){t.beginPath();t.arc(x,y,r,0,7);t.fill()}

/* ---------- ゲーム状態 ---------- */
function newGame(){
  balls=[];cue={n:0,x:HEAD,y:H/2,vx:0,vy:0,in:true};balls.push(cue);
  const dx=Math.sqrt(3)*R+0.3,pos=[];
  [1,2,3,2,1].forEach((cnt,i)=>{for(let j=0;j<cnt;j++)pos.push([FOOT+i*dx,H/2+(j-(cnt-1)/2)*(2*R+0.3)])});
  const rest=[2,3,4,5,6,7,8].sort(()=>Math.random()-.5);
  pos.forEach((p,i)=>{const n=i===0?1:i===4?9:rest.pop();balls.push({n,x:p[0],y:p[1],vx:0,vy:0,in:true})});
  turn=Math.random()<.5?0:1;ballInHand=true;breakShot=true;moving=false;gameOver=false;aim=0;
  setMsg(`${NAMES[turn]}のブレイク。手球は左の線より左側に置けます`,'');
  ui();req();
}
const lowest=()=>Math.min(...balls.filter(b=>b.in&&b.n>0).map(b=>b.n));
function setMsg(t,type){msg=t;msgType=type;msgEl.textContent=t;msgEl.className='msg '+(type||'')}
function ui(){
  $('pl0').classList.toggle('on',turn===0&&!gameOver);$('pl1').classList.toggle('on',turn===1&&!gameOver);
  const l=lowest();$('tbn').textContent=isFinite(l)?l:'-';
  const tb=$('tb');tb.style.background=l===9?'linear-gradient(#f4f1ea 22%,#f2c230 22% 78%,#f4f1ea 78%)':COL[l]||'#444';
  shotBtn.disabled=moving||gameOver;
}

function shoot(){
  if(moving||gameOver||!cue.in)return;
  const sp=(2+pw.value/100*26)*SC;
  cue.vx=Math.cos(aim)*sp;cue.vy=Math.sin(aim)*sp;
  shot={target:lowest(),first:null,pocketed:[],rail:false};
  moving=true;ballInHand=false;drag=null;setMsg('','');ui();req();
}

/* ---------- 物理 ---------- */
function step(){
  let max=0;for(const b of balls)if(b.in)max=Math.max(max,Math.abs(b.vx),Math.abs(b.vy));
  const n=Math.max(1,Math.ceil(max/(R*0.4)));
  for(let s=0;s<n;s++){
    for(const b of balls){if(!b.in)continue;b.x+=b.vx/n;b.y+=b.vy/n;rails(b)}
    for(let i=0;i<balls.length;i++){const a=balls[i];if(!a.in)continue;
      for(let j=i+1;j<balls.length;j++){const c=balls[j];if(!c.in)continue;collide(a,c)}}
  }
  let any=false;
  for(const b of balls){if(!b.in)continue;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp<0.05){b.vx=b.vy=0;continue}
    const k=Math.max(0,sp*0.987-0.022*SC)/sp;b.vx*=k;b.vy*=k;any=true}
  if(!any){moving=false;endShot()}
}
function pocket(b){b.in=false;b.vx=b.vy=0;shot.pocketed.push(b.n)}
function rails(b){
  const e=0.75;
  const vMouth=b.y<CM||b.y>H-CM, hMouth=b.x<CM||b.x>W-CM||Math.abs(b.x-W/2)<SM;
  if(b.x<R){ if(vMouth){if(b.x<R*0.2)return pocket(b)} else {b.x=R;b.vx=-b.vx*e;hitRail()} }
  else if(b.x>W-R){ if(vMouth){if(b.x>W-R*0.2)return pocket(b)} else {b.x=W-R;b.vx=-b.vx*e;hitRail()} }
  if(b.y<R){ if(hMouth){if(b.y<R*0.2)return pocket(b)} else {b.y=R;b.vy=-b.vy*e;hitRail()} }
  else if(b.y>H-R){ if(hMouth){if(b.y>H-R*0.2)return pocket(b)} else {b.y=H-R;b.vy=-b.vy*e;hitRail()} }
  if(b.x<-R||b.x>W+R||b.y<-R||b.y>H+R)pocket(b);
}
function hitRail(){if(shot.first!==null)shot.rail=true}
function collide(a,c){
  const dx=c.x-a.x,dy=c.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*R*R||d2===0)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*R-d)/2;
  a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
  const rel=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;if(rel<=0)return;
  const imp=rel*(1+0.95)/2;a.vx-=imp*nx;a.vy-=imp*ny;c.vx+=imp*nx;c.vy+=imp*ny;
  if(shot.first===null&&(a.n===0||c.n===0))shot.first=a.n===0?c.n:a.n;
}

/* ---------- ショット判定（9ボールルール） ---------- */
function endShot(){
  const s=shot,me=NAMES[turn],other=NAMES[1-turn];
  let foul=null;
  if(s.pocketed.includes(0))foul='手球がポケットに落ちた';
  else if(s.first===null)foul='どの球にも当たらなかった';
  else if(s.first!==s.target)foul=`最初に${s.target}番に当てていない`;
  else if(!s.pocketed.some(n=>n>0)&&!s.rail)foul='当てた後どの球もクッションに入らなかった';
  const nine=s.pocketed.includes(9);
  breakShot=false;
  if(foul){
    if(nine)respot(balls.find(b=>b.n===9),FOOT,H/2);
    if(!cue.in){cue.in=true;respot(cue,HEAD,H/2)}
    turn=1-turn;ballInHand=true;
    setMsg(`ファウル：${foul}。${other}のフリーボール（手球を動かせます）`,'foul');
  }else if(nine){
    gameOver=true;setMsg(`${me}の勝ち！ 9番をポケット 🎱`,'win');
  }else if(s.pocketed.length){
    setMsg(`ナイス！ ${s.pocketed.join('・')}番イン。${me}が続けて撃ちます`,'');
  }else{
    turn=1-turn;setMsg(`${other}の番です`,'');
  }
  if(!gameOver&&cue.in){const t=balls.find(b=>b.n===lowest());if(t)aim=Math.atan2(t.y-cue.y,t.x-cue.x)}
  ui();
}
function free(x,y,self){return balls.every(b=>b===self||!b.in||Math.hypot(b.x-x,b.y-y)>=2*R+0.5)}
function respot(b,x,y){b.vx=b.vy=0;b.in=true;let k=0;while(!free(x+k,y,b)&&x+k<W-R)k+=1;if(x+k>=W-R){k=0;while(!free(x-k,y,b))k+=1;k=-k}b.x=x+k;b.y=y}

/* ---------- 描画 ---------- */
function req(){if(!rafId)rafId=requestAnimationFrame(frame)}
function frame(){rafId=0;if(moving)step();render();if(moving)req()}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(tableImg,0,0);
  ctx.setTransform(scale,0,0,scale,0,0);
  if(!moving&&!gameOver&&cue.in){drawGuide();drawStick()}
  for(const b of balls)if(b.in)ctx.drawImage(sprites[b.n],B+b.x-R-1,B+b.y-R-1,2*R+2,2*R+2);
  if(ballInHand&&!moving&&!gameOver){
    ctx.save();ctx.setLineDash([3,4]);ctx.strokeStyle='#d8b25a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(B+cue.x,B+cue.y,R+5,0,7);ctx.stroke();ctx.restore();
    if(breakShot){ctx.fillStyle='rgba(216,178,90,.07)';ctx.fillRect(B,B,HEAD,H)}
  }
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(B+x1,B+y1);ctx.lineTo(B+x2,B+y2);ctx.stroke()}
function drawGuide(){
  ctx.save();ctx.lineWidth=1.5;ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(255,255,255,.85)';
  let px=cue.x,py=cue.y,dx=Math.cos(aim),dy=Math.sin(aim);
  for(let k=0;k<3;k++){
    let tb=Infinity,hb=null;
    for(const b of balls){if(!b.in||b===cue)continue;
      const fx=b.x-px,fy=b.y-py,t=fx*dx+fy*dy;if(t<=0)continue;
      const d2=fx*fx+fy*fy-t*t,r2=4*R*R;if(d2>r2)continue;
      const th=t-Math.sqrt(r2-d2);if(th>-0.01&&th<tb){tb=th;hb=b}}
    const tx=dx>0?(W-R-px)/dx:dx<0?(R-px)/dx:Infinity,ty=dy>0?(H-R-py)/dy:dy<0?(R-py)/dy:Infinity,tr=Math.min(tx,ty);
    if(hb&&tb<=tr){
      const gx=px+dx*tb,gy=py+dy*tb;line(px,py,gx,gy);
      ctx.beginPath();ctx.arc(B+gx,B+gy,R,0,7);ctx.stroke();
      const nx=(hb.x-gx)/(2*R),ny=(hb.y-gy)/(2*R);
      ctx.strokeStyle='#f0c860';ctx.lineWidth=2;line(hb.x,hb.y,hb.x+nx*150,hb.y+ny*150);
      const dn=dx*nx+dy*ny;let ux=dx-dn*nx,uy=dy-dn*ny;const ul=Math.hypot(ux,uy);
      if(ul>0.05){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;line(gx,gy,gx+ux/ul*70,gy+uy/ul*70)}
      break;
    }
    const hx=px+dx*tr,hy=py+dy*tr;line(px,py,hx,hy);
    const mouth=tx<ty?(hy<CM||hy>H-CM):(hx<CM||hx>W-CM||Math.abs(hx-W/2)<SM);
    if(mouth)break;
    if(tx<ty)dx=-dx;else dy=-dy;px=hx;py=hy;
    ctx.strokeStyle='rgba(255,255,255,'+(k?0.3:0.55)+')';
  }
  ctx.restore();
}
function drawStick(){
  const c=Math.cos(aim),s=Math.sin(aim),off=R+5+pw.value*0.35,x1=cue.x-c*off,y1=cue.y-s*off;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='#c99b62';ctx.lineWidth=5;line(x1-c*10,y1-s*10,x1-c*330,y1-s*330);
  ctx.strokeStyle='#3b2a1d';ctx.lineWidth=6;line(x1-c*230,y1-s*230,x1-c*330,y1-s*330);
  ctx.strokeStyle='#e8eef0';ctx.lineWidth=4;line(x1,y1,x1-c*10,y1-s*10);
  ctx.restore();
}

/* ---------- 入力 ---------- */
function toTable(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width-B,y:(e.clientY-r.top)*CH/r.height-B}}
function place(p){
  const x=Math.min(Math.max(p.x,R),breakShot?HEAD:W-R),y=Math.min(Math.max(p.y,R),H-R);
  if(free(x,y,cue)){cue.x=x;cue.y=y}
}
cv.addEventListener('pointerdown',e=>{
  if(moving||gameOver||!cue.in)return;
  const p=toTable(e);cv.setPointerCapture(e.pointerId);
  drag=(ballInHand&&Math.hypot(p.x-cue.x,p.y-cue.y)<R*2.6)?'place':'aim';
  move(p);
});
cv.addEventListener('pointermove',e=>{if(drag)move(toTable(e))});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));
function move(p){
  if(drag==='place')place(p);
  else if(Math.hypot(p.x-cue.x,p.y-cue.y)>2)aim=Math.atan2(p.y-cue.y,p.x-cue.x);
  req();
}
function nudge(deg){if(moving)return;aim+=deg*Math.PI/180;req()}
[['aimL',-0.2],['aimR',0.2]].forEach(([id,d])=>{
  const el=$(id);let t=null;
  const stop=()=>{clearInterval(t);t=null};
  el.addEventListener('pointerdown',e=>{e.preventDefault();nudge(d);stop();t=setInterval(()=>nudge(d),50)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nudge(d)}});
});
pw.addEventListener('input',()=>{pv.textContent=pw.value;req()});
shotBtn.addEventListener('click',shoot);
let resetArm=0;
$('newg').addEventListener('click',e=>{
  if(gameOver||Date.now()-resetArm<3000){resetArm=0;e.target.textContent='新しいゲーム';newGame();return}
  resetArm=Date.now();e.target.textContent='もう一度押すとリセット';
  setTimeout(()=>{if(resetArm&&Date.now()-resetArm>=3000)e.target.textContent='新しいゲーム'},3100);
});
window.addEventListener('keydown',e=>{
  if(e.target===pw&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();nudge(e.shiftKey?-0.05:-0.5)}
  else if(e.key==='ArrowRight'){e.preventDefault();nudge(e.shiftKey?0.05:0.5)}
  else if(e.key==='ArrowUp'){e.preventDefault();pw.value=+pw.value+5;pv.textContent=pw.value;req()}
  else if(e.key==='ArrowDown'){e.preventDefault();pw.value=+pw.value-5;pv.textContent=pw.value;req()}
  else if(e.key===' '){e.preventDefault();shoot()}
  else if(e.key==='f'||e.key==='F'){toggleBig()}
});
const bigBtn=$('bigb');
function setBig(on){
  document.body.classList.toggle('big',on);
  bigBtn.textContent=on?'通常表示':'大画面';
  resize();
}
function toggleBig(){
  const on=!document.body.classList.contains('big');
  setBig(on);
  try{
    if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  }catch(_){}
}
bigBtn.addEventListener('click',toggleBig);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('big'))setBig(false)});
new ResizeObserver(resize).observe(wrap);
newGame();resize();
})();
</script>

</html>
